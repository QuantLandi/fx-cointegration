[project]
name = "fx-cointegration"
version = "0.1.0"
description = "Reproducible FX cointegration pairs-trading pipeline (Paper 1)"
authors = [
    { name = "Alexandre Landi", email = "alexandre.landi@skema.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "statsmodels>=0.14.6",
    "yfinance>=0.2",
]

[dependency-groups]
dev = [
    "pymupdf>=1.28.0",
]
